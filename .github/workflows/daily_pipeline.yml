name: TechyUpdates Hackathons Engine - Daily Pipeline

on:
  schedule:
    # Runs daily at 02:30 UTC (8:00 AM IST)
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-pipeline:
    name: Execute Autonomous Hackathon Ingestion & Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated test suite
        run: |
          pytest tests/ -v

      - name: Execute Hackathons Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_COMMUNITY_CHANNEL_ID: ${{ secrets.TELEGRAM_COMMUNITY_CHANNEL_ID }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          python api/trigger.py

      - name: Commit & Push Updated History
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/sent_history.json
          git diff --staged --quiet || (git commit -m "chore(data): sync persistent hackathon history [skip ci]" && git push origin main)

      - name: Archive Daily Excel Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-hackathons-spreadsheet
          path: "*.xlsx"
          retention-days: 30
