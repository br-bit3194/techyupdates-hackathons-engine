[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "techyupdates-hackathons-engine"
version = "2.1.0"
description = "Autonomous Global Hackathons & Competitions Pipeline for TechyUpdates"
authors = [{ name = "TechyUpdates", email = "community@techyupdates.dev" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "google-genai>=0.1.1",
    "openpyxl>=3.1.2",
    "pydantic>=2.7.0",
    "beautifulsoup4>=4.12.3",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
